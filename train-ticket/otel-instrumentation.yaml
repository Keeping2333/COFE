#   annotations:
#     instrumentation.opentelemetry.io/inject-java: "true"
# =============================================================================

apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: otel-instrumentation
  namespace: tt
spec:


  exporter:
    endpoint: http://otel-collector.otel-system.svc.cluster.local:4318
  

  resource:
    resourceAttributes:
      deployment.environment: train-ticket-vm
      service.namespace: train-ticket
  

  sampler:
    type: parentbased_traceidratio
    argument: "1"
  

  propagators:
    - tracecontext
    - baggage
    - b3
  

  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.4.0
    env:

      - name: OTEL_METRICS_EXPORTER
        value: otlp
      - name: OTEL_LOGS_EXPORTER
        value: otlp

