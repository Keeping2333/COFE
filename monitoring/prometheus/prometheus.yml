# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'central-vm'

# =============================================================================

# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'central-prometheus'

  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          instance: 'central-otel-collector'

  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
        labels:
          instance: 'central-jaeger'

