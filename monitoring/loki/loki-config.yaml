auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Ingester — short chunk lifetime so experiments' fresh data is queryable from disk
# quickly after run_experiment.py's export_delay (default 60s).
# Default chunk_idle_period is 30m, which keeps experiment data stuck in ingester memory.
ingester:
  chunk_idle_period: 1m
  chunk_target_size: 1572864  # 1.5MB
  max_chunk_age: 2m
  flush_check_period: 30s

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093


limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_length: 721h  # 30 days
  max_query_parallelism: 32
  max_entries_limit_per_query: 50000  # Allow large log exports for RCA dataset collection
  # round2: large INFO/WARN queries need longer timeout — chunks are fetched cold from filesystem
  query_timeout: 5m
  split_queries_by_interval: 30s
  tsdb_max_query_parallelism: 32


query_scheduler:
  max_outstanding_requests_per_tenant: 2048

# Querier — concurrent execution of subqueries after split
querier:
  max_concurrent: 16
  # round2: enable query result streaming so large query_range doesn't buffer fully in memory
  multi_tenant_queries_enabled: false

# Query frontend — split + cache
frontend:
  max_outstanding_per_tenant: 2048
  log_queries_longer_than: 10s


storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
    query_ready_num_days: 7

# Chunk cache — biggest win for cold-chunk reads in research-scale Loki
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 1024
      ttl: 1h

# Query result cache — avoids re-running identical queries (run_experiment.py re-queries during validation)
query_range:
  parallelise_shardable_queries: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256
        ttl: 1h
  cache_results: true


compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

